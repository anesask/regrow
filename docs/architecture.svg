<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Neue Haas Grotesk Display Pro, NeueHaasDisplay-Roman, Inter, Segoe UI, Helvetica, Arial, sans-serif">
