[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
fs_permissions = [
  { access = "read", path = "../backend/data" },
  { access = "read-write", path = "../backend/chain" },
  { access = "read-write", path = "../app/src/lib/chain" },
]

[invariant]
runs = 128
depth = 128
fail_on_revert = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 120
